name: booking-ticket-system

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [booking-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI -> http://localhost:15672 (guest/guest)
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [booking-net]

  # ---------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------
  users:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: Users
    ports:
      - '50051:50051'
    restart: unless-stopped
    environment:
      NODE_ENV: development-docker
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      USERS_DATABASE_NAME: users_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      USERS_GRPC_PORT: 50051
    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy
    networks: [booking-net]

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: Notifications
    ports:
      - '50052:50052'
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      NOTIFICATIONS_GRPC_PORT: 50052
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [booking-net]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    restart: unless-stopped
    environment:
      API_GATEWAY_PORT: 3000
      USERS_SERVICE_URL: users:50051
    ports:
      - '3000:3000'
    depends_on:
      - users
    networks: [booking-net]

  # ---------------------------------------------------------------------
  # Scaffolded services (no business logic yet, wired for when you build them out)
  # ---------------------------------------------------------------------
  catalog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: Catalog
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - '3001:3000'
    networks: [booking-net]

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: Payment
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - '3002:3000'
    networks: [booking-net]

  booking:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: Booking
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - '3003:3000'
    networks: [booking-net]

networks:
  booking-net:
    driver: bridge

volumes:
  postgres_data:
