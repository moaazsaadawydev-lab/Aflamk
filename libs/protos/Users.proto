syntax = "proto3";

package user;

service UsersService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc CurrentUser(CurrentUserRequest) returns (CurrentUserResponse) {}
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}
}

message CropData {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  optional float zoom = 5;
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  int32 age = 4;
  string gender = 5;
  string country = 6;
  optional string temp_object_key = 7;
  optional float crop_x = 8;
  optional float crop_y = 9;
  optional float crop_width = 10;
  optional float crop_height = 11;
  optional float crop_zoom = 12;
}

message RegisterResponse {
  string id = 1;
  string message = 2;
  CurrentUserResponse user = 3;
}

message VerifyEmailRequest {
  string email = 1;
  int32 code = 2;
}

message VerifyEmailResponse {
  string message = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  optional string user_agent = 3;
  optional string ip_address = 4;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message CurrentUserRequest {
  string id = 1;
}

message CurrentUserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string avatar_key = 4;
  string gender = 5;
  string country = 6;
  int32 age = 7;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string message = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string name = 2;
  optional string country = 3;
  optional int32 age = 4;
  optional string temp_key = 5;
  optional float crop_x = 6;
  optional float crop_y = 7;
  optional float crop_width = 8;
  optional float crop_height = 9;
  optional float crop_zoom = 10;
}

message UpdateProfileResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
  int32 age = 5;
  optional string avatar_key = 6;
}
